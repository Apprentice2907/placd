name: Scrape Jobs

on:
  schedule:
    # Run once daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Specific scraper to run (leave blank for all)'
        required: false
        default: ''
      compact:
        description: 'Give freed space back to Neon (locks the jobs table briefly)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  scrape:
    name: Run Job Scrapers
    runs-on: ubuntu-latest
    timeout-minutes: 360

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Shrink stored job details
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TYPESENSE_ENABLED: 'false'
        run: python main.py cleanup --trim-only ${{ github.event.inputs.compact == 'true' && '--compact' || '' }}

      - name: Run scrapers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TYPESENSE_ENABLED: 'false'
          PLAYWRIGHT_ENABLED: 'false'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.source }}" ]; then
            echo "Running scraper for: ${{ github.event.inputs.source }}"
            python main.py scrape --source ${{ github.event.inputs.source }}
          else
            echo "Running all scrapers..."
            python main.py scrape
          fi

      # Runs after scraping so jobs that are still listed count as recently seen
      - name: Delete old jobs
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TYPESENSE_ENABLED: 'false'
        run: python main.py cleanup

      # GitHub disables scheduled workflows after 60 days without repo activity
      - name: Keep schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable scraper.yml --repo ${{ github.repository }}

      - name: Report status
        if: always()
        run: echo "Scraper finished with status ${{ job.status }}"
