name: Scrape Jobs

on:
  schedule:
    # Every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Specific scraper to run (leave blank for all)'
        required: false
        default: ''

jobs:
  scrape:
    name: Run Job Scrapers
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scrapers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TYPESENSE_ENABLED: 'false'
          PLAYWRIGHT_ENABLED: 'false'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.source }}" ]; then
            echo "Running scraper for: ${{ github.event.inputs.source }}"
            python main.py scrape --source ${{ github.event.inputs.source }}
          else
            echo "Running all scrapers..."
            python main.py scrape
          fi

      - name: Report status
        if: always()
        run: echo "Scraper finished with status ${{ job.status }}"
