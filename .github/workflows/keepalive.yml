name: Keepalive

# GitHub disables scheduled workflows after 60 days of repo inactivity.
# This weekly no-op prevents that from happening.
on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight UTC
  workflow_dispatch:

jobs:
  keepalive:
    name: Keepalive ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: echo "keepalive — preventing GitHub from disabling scheduled workflows"
