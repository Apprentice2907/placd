services:
  - type: web
    name: placd-api
    env: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /api/stats/quick
    envVars:
      - key: PORT
        value: "8000"
      - key: TYPESENSE_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: static
    name: placd-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://placd-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
